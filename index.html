<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Kiếm Tiền Online</title>
    
    <!-- Adsterra Popunder Code -->
    <script type='text/javascript' src='//pl30841570.highrevenuesgate.com/beb08be9a75245ef134558730d851eab/invoke.js'></script>
    
    <!-- Firebase SDK (v9 Mod) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f4f9; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .balance-box { text-align: center; background: linear-gradient(135deg, #10b981, #059669); color: white; border-radius: 12px; padding: 20px; }
        .balance { font-size: 32px; font-weight: bold; margin-top: 5px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e5e7eb; border-radius: 8px; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-success { background: #10b981; color: white; margin-top: 5px; }
        .btn-task { display: block; text-align: center; background: #f59e0b; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; margin-bottom: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">

    <!-- KHUNG ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="authCard" class="card">
        <h2 style="text-align: center; margin-top:0;">Đăng Nhập</h2>
        <input type="email" id="authEmail" placeholder="Email của bạn">
        <input type="password" id="authPassword" placeholder="Mật khẩu">
        <button onclick="login()" class="btn-primary" style="margin-bottom: 8px;">Đăng Nhập</button>
        <button onclick="register()" style="background:#6b7280; color:white;">Tạo Tài Khoản Mới</button>
    </div>

    <!-- GIAO DIỆN CHÍNH (Sau khi Đăng nhập) -->
    <div id="mainApp" class="hidden">
        
        <!-- Số dư -->
        <div class="balance-box">
            <div style="font-size: 14px; opacity: 0.9;">SỐ DƯ HIỆN TẠI</div>
            <div class="balance" id="userBalance">0 đ</div>
            <div id="userEmailDisplay" style="font-size: 12px; opacity: 0.8; margin-top:5px;"></div>
        </div>

        <!-- Banner Adsterra -->
        <div class="card" style="text-align: center; padding: 10px; margin-top:15px;">
            <script type="text/javascript">
                atOptions = { 'key' : '0461b5d40b2c62d6535832dd2492eaf6', 'format' : 'iframe', 'height' : 50, 'width' : 320, 'params' : {} };
            </script>
            <script type="text/javascript" src="//www.highrevenuesgate.com/0461b5d40b2c62d6535832dd2492eaf6/invoke.js"></script>
        </div>

        <!-- Nhiệm vụ YeuMoney -->
        <div class="card">
            <h3 style="margin-top:0; color:#1f2937;">Nhiệm Vụ SEO (+100đ)</h3>
            <p style="font-size: 13px; color:#6b7280;">Bấm link bên dưới để vượt link lấy mã xác nhận:</p>
            
            <a href="https://yeumoney.com/oWCXUIOwBc5" target="_blank" class="btn-task">
                🔗 LẤY MÃ SEO YEUMONEY
            </a>
            
            <input type="text" id="taskCode" placeholder="Dán mã nhận được vào đây...">
            <button onclick="submitTask()" class="btn-success">Xác Nhận Nhận 100đ</button>
        </div>

        <!-- Chức năng Rút tiền -->
        <div class="card">
            <h3 style="margin-top:0; color:#1f2937;">Rút Tiền</h3>
            <select id="withdrawMethod">
                <option value="MoMo">Ví MoMo</option>
                <option value="MBBank">Ngân hàng MBBank</option>
                <option value="ViettelMoney">Viettel Money</option>
            </select>
            <input type="text" id="withdrawAccount" placeholder="Số điện thoại / Số tài khoản">
            <input type="number" id="withdrawAmount" placeholder="Số tiền rút (Tối thiểu 10.000đ)">
            <button onclick="requestWithdraw()" class="btn-primary">Gửi Yêu Cầu Rút Tiền</button>
        </div>

        <button onclick="logout()" style="background:#ef4444; color:white; margin-bottom:30px;">Đăng Xuất</button>
    </div>

</div>

<script>
    // 1. CẤU HÌNH FIREBASE (Thay thông số bên dưới bằng cấu hình Firebase của bạn nếu có)
    const firebaseConfig = {
        apiKey: "AIzaSyDummyKeyForTemplate123456789",
        authDomain: "app-kiem-tien.firebaseapp.com",
        databaseURL: "https://app-kiem-tien-default-rtdb.firebaseio.com",
        projectId: "app-kiem-tien",
        storageBucket: "app-kiem-tien.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abc123def456"
    };

    // Khởi tạo Firebase
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.database();

    let currentUser = null;

    // 2. THEO DÕI TRẠNG THÁI ĐĂNG NHẬP
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('authCard').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('userEmailDisplay').innerText = user.email;
            
            // Lắng nghe số dư thời gian thực từ Database
            db.ref('users/' + user.uid + '/balance').on('value', snapshot => {
                const bal = snapshot.val() || 0;
                document.getElementById('userBalance').innerText = bal.toLocaleString('vi-VN') + " đ";
            });
        } else {
            currentUser = null;
            document.getElementById('authCard').classList.remove('hidden');
            document.getElementById('mainApp').classList.add('hidden');
        }
    });

    // 3. ĐĂNG KÝ / ĐĂNG NHẬP
    function register() {
        const email = document.getElementById('authEmail').value;
        const pass = document.getElementById('authPassword').value;
        auth.createUserWithEmailAndPassword(email, pass)
            .then(cred => {
                return db.ref('users/' + cred.user.uid).set({ balance: 0, email: email });
            })
            .catch(err => alert("Lỗi đăng ký: " + err.message));
    }

    function login() {
        const email = document.getElementById('authEmail').value;
        const pass = document.getElementById('authPassword').value;
        auth.signInWithEmailAndPassword(email, pass)
            .catch(err => alert("Lỗi đăng nhập: " + err.message));
    }

    function logout() {
        auth.signOut();
    }

    // 4. XỬ LÝ NHIỆM VỤ
    function submitTask() {
        const code = document.getElementById('taskCode').value.trim();
        if (code.length < 3) {
            alert("Mã không hợp lệ!");
            return;
        }

        // Tăng số dư +100đ vào CSDL Firebase
        db.ref('users/' + currentUser.uid + '/balance').transaction(current => {
            return (current || 0) + 100;
        }).then(() => {
            alert("✅ Xác nhận thành công! Bạn nhận được +100đ.");
            document.getElementById('taskCode').value = "";
        });
    }

    // 5. XỬ LÝ RÚT TIỀN
    function requestWithdraw() {
        const method = document.getElementById('withdrawMethod').value;
        const account = document.getElementById('withdrawAccount').value.trim();
        const amount = parseInt(document.getElementById('withdrawAmount').value);

        if (!account || isNaN(amount) || amount < 10000) {
            alert("Vui lòng nhập số tài khoản và số tiền tối thiểu 10.000đ!");
            return;
        }

        db.ref('users/' + currentUser.uid + '/balance').get().then(snapshot => {
            const currentBal = snapshot.val() || 0;
            if (currentBal < amount) {
                alert("Số dư của bạn không đủ!");
            } else {
                // Trừ tiền và tạo đơn rút tiền gửi cho Admin
                db.ref('users/' + currentUser.uid + '/balance').set(currentBal - amount);
                db.ref('withdrawRequests').push({
                    uid: currentUser.uid,
                    email: currentUser.email,
                    method: method,
                    account: account,
                    amount: amount,
                    timestamp: Date.now()
                });
                alert("🚀 Gửi yêu cầu rút tiền thành công! Admin sẽ xử lý trong 24h.");
                document.getElementById('withdrawAccount').value = "";
                document.getElementById('withdrawAmount').value = "";
            }
        });
    }
</script>

</body>
</html>
